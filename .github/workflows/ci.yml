# Every-PR gate (ARCHITECTURE §14, §16 M0).
#
# One job, run in the order a contributor would run it locally, because a CI
# file that no human can reproduce by hand is a CI file that lies. macOS is the
# shipped platform (ADR-0001), so it is the platform we gate on.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A superseded push is wasted runner time; the newest commit is the only one
  # anyone will look at.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint · typecheck · test · headless run
    # macos-latest is Apple silicon. Nothing in this job is arch-specific, but
    # keeping CI on the shipped platform means the packaging job in
    # release.yml is not the first time we see macOS-only breakage.
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # Must come before setup-node: `cache: pnpm` needs the pnpm binary to
      # locate the store. The version is NOT pinned here on purpose —
      # `packageManager` in the root package.json (pnpm@10.33.2) is the single
      # source of truth, and a second pin would eventually disagree with it.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # BUILD ORDER, and the reason this step is not at the bottom: the
      # first-party plugin is loaded from its built `dist/index.js` by a real
      # PluginHost (ADR-0008). The plugin package's own tests and the headless
      # CLI run below both need that artifact to exist, so it is built before
      # anything that consumes it — the same ordering the root `pnpm build`
      # script and packages/app/electron-builder.yml encode.
      - name: Build the first-party plugin
        run: pnpm --filter @archspace/plugin-aec-review build

      - name: Test
        run: pnpm test

      # The integration harness, not a demo (ADR-0013): the CLI runs the shipped
      # example workflow end to end with no Electron, no network and no AI
      # provider — the mock gateway serves the ai.* nodes. If this breaks, the
      # engine, the document format, the node registry or the plugin boundary
      # broke, and it says so in the event stream it prints.
      #
      # `--trust-plugin` is required, not incidental: this workflow uses
      # `aec.review.code_compliance`, which lives in the first-party plugin, and
      # ADR-0008 makes an unconsented plugin unloadable even when it declares no
      # permissions. A runner has no consent dialog, so the grant is made here
      # where it is reviewable in the diff. If this flag were ever unnecessary,
      # that would mean consent had stopped being enforced.
      #
      # ALL THREE shipped examples, not just the first. Running one of them is
      # how `branching-review` shipped broken: it wires a merged review into the
      # report node, which read a field only the code review has, and died. An
      # example the product ships and CI never runs is an example that is not
      # actually tested — and these are the first thing a new user opens.
      - name: Headless CLI integration run
        run: |
          for workflow in packages/app/resources/*.archspace.yaml; do
            echo "::group::$workflow"
            pnpm cli run "$workflow" --trust-plugin aec-review
            echo "::endgroup::"
          done

      # NEITHER lint NOR typecheck compiles the app. That is not a theoretical
      # gap: a misplaced JSX comment inside a `&&` expression passed both and
      # failed esbuild, and would have reached a release tag as the first sign
      # of trouble. `pnpm build` is what every other gate above is a proxy for.
      #
      # It also runs scripts/check-bundle.mjs, which fails the build if any
      # `@archspace/*` specifier survives into out/main or out/preload. That
      # check exists because electron-vite externalises workspace dependencies
      # by default, which produced an app that passed every test in this file
      # and then would not launch at all. Until now it only ever ran locally.
      - name: Build the app
        run: pnpm build
